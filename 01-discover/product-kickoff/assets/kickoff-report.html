<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$pagetitle$</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fff;
      --canvas: #f3f6f5;
      --text: #182722;
      --muted: #51645d;
      --line: #dce7e2;
      --accent: #17644f;
      --tint: #eaf5f0;
      font-family: system-ui, 'Microsoft YaHei UI', sans-serif;
      line-height: 1.65;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--text); background: var(--canvas); }
    a { color: var(--accent); text-underline-offset: .2em; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 14rem) minmax(0, 1fr);
      gap: clamp(1rem, 3vw, 3rem);
      max-width: 1540px;
      padding: clamp(1rem, 4vw, 3rem);
      margin: auto;
      align-items: start;
    }
    .layout.single { grid-template-columns: minmax(0, 1fr); }
    nav {
      position: sticky;
      top: 1.5rem;
      max-height: calc(100vh - 3rem);
      overflow: auto;
      font-size: .9rem;
      padding: .9rem 1rem;
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: .75rem;
    }
    nav > strong { color: var(--muted); }
    nav ul { list-style: none; padding-inline-start: .65rem; margin: .25rem 0; }
    nav > ul { padding: 0; }
    nav li { margin: .3rem 0; }
    nav a { text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    main {
      min-width: 0;
      background: var(--paper);
      padding: clamp(1rem, 3vw, 3rem);
      border: 1px solid var(--line);
      border-radius: 1rem;
    }
    h1, h2, h3 { line-height: 1.35; scroll-margin-top: 1rem; }
    h1 { font-size: clamp(1.75rem, 4vw, 2.85rem); margin: 0 0 1.1rem; letter-spacing: -.035em; }
    h2 { font-size: clamp(1.3rem, 3vw, 1.7rem); margin: 2.7rem 0 1rem; }
    hr { border: 0; border-top: 1px solid var(--line); margin: 2rem 0; }
    hr + h2 { margin-top: 0; }
    h3 { font-size: 1.13rem; margin-top: 1.65rem; }
    blockquote { margin: 1rem 0; padding: .3rem 1rem; border-inline-start: 3px solid var(--accent); background: var(--tint); color: var(--muted); }
    p, li, td, th { overflow-wrap: anywhere; }
    code { background: var(--canvas); border-radius: .2em; padding: .08em .22em; }
    pre { overflow: auto; padding: .75rem; background: var(--canvas); }
    .table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: .55rem; margin: 1rem 0 1.35rem; }
    table { width: 100%; min-width: 38rem; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: start; vertical-align: top; padding: .6rem .75rem; border-bottom: 1px solid var(--line); }
    th { color: #154b3d; background: var(--tint); min-width: 5ch; }
    td { min-width: 7ch; }
    tr:last-child td { border-bottom: 0; }
    tbody tr:nth-child(even) { background: #f7faf9; }
    @media (max-width: 820px) {
      .layout { grid-template-columns: minmax(0, 1fr); }
      nav { position: static; max-height: none; }
    }
    @media print {
      body { background: white; }
      .layout { display: block; padding: 0; }
      nav { display: none; }
      main { padding: 0; border: 0; }
      .table-scroll { overflow: visible; }
      table { min-width: 0; font-size: .75rem; }
      th, td { padding: .3rem; }
      h2, h3 { break-after: avoid; }
      thead { display: table-header-group; }
    }
  </style>
</head>
<body>
  <div class="layout$if(toc)$ $else$ single$endif$">
    $if(toc)$
    <nav aria-label="报告目录">
      <strong>报告目录</strong>
      $table-of-contents$
    </nav>
    $endif$
    <main id="report">
      $body$
    </main>
  </div>
  <script>
    for (const table of document.querySelectorAll('#report table')) {
      const wrapper = document.createElement('div');
      wrapper.className = 'table-scroll';
      wrapper.tabIndex = 0;
      wrapper.setAttribute('role', 'region');
      const heading = table.closest('section')?.querySelector('h2, h3, h4');
      wrapper.setAttribute('aria-label', heading ? heading.textContent + '表格' : '报告表格');
      table.before(wrapper);
      wrapper.append(table);
    }
  </script>
</body>
</html>
